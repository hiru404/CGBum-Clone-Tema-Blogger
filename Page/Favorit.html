<style>
  
  .favorites-loading{display:flex;min-height:92px;align-items:center;justify-content:center;gap:10px;color:var(--text-secondary);font-size:0.9rem}.favorites-loading-spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:favorites-loading-spin .7s linear infinite}.favorite-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:8px 0 14px}.favorite-search{display:flex;align-items:center;width:38px;height:38px;overflow:hidden;border:1px solid var(--border);border-radius:9px;background:var(--bg-card);transition:width .2s ease}.favorite-search.is-open{width:min(230px,55vw)}.favorite-search button{flex:0 0 38px;display:grid;place-items:center;width:38px;height:38px;border:0;background:transparent;color:var(--text-secondary);cursor:pointer}.favorite-search button:hover{color:var(--accent)}.favorite-search svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}.favorite-search input{min-width:0;width:100%;height:36px;padding:0 10px 0 0;border:0;outline:0;background:transparent;color:var(--text);font-size:.84rem}.favorite-tools select{height:38px;padding:0 30px 0 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg-card);color:var(--text);font-size:.8rem}.favorite-search-empty{margin:22px 0;color:var(--text-secondary);text-align:center}.comic-card.is-search-hidden{display:none !important}@keyframes favorites-loading-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.favorites-loading-spinner{animation:none}}.favorites-empty{text-align:center;padding:60px 20px;color:var(--text-muted)}.favorites-empty svg{margin-bottom:16px;opacity:0.4}.favorites-empty h2{margin-bottom:8px;color:var(--text-secondary)}.btn-fav-remove{background:none;border:none;cursor:pointer;padding:2px;color:var(--text-muted);border-radius:50%;transition:all var(--transition);display:flex;align-items:center;justify-content:center}.btn-fav-remove:hover{color:#ef4444;background:rgba(239,68,68,0.1)}.fav-last-row{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0}.fav-last-read{display:none;align-items:center;gap:3px;min-width:0;color:var(--accent);font-size:11px !important;line-height:1 !important;font-weight:500}.fav-last-read.has-value{display:inline-flex}.fav-last-read-icon{width:auto;height:auto;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0.9;font-size:10px !important;line-height:1}.fav-last-read-text{font-size:inherit !important;min-width:0;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fav-remove-inline{margin-left:auto;flex-shrink:0}.fav-card-detail{display:flex;flex-direction:column;gap:4px;font-size:0.78rem;color:var(--text-muted);margin-top:4px;padding-top:6px;border-top:1px solid var(--border)}.fav-card-detail .fav-last-read{color:var(--accent);font-weight:500}
</style> 
  <div class="section-header">
    <h1 style="font-size:1.3rem;padding-left:14px;position:relative;">
      <span style="position:absolute;left:0;top:2px;bottom:2px;width:4px;background:var(--accent);border-radius:2px;"></span>
      Favorit Saya
      <span class="text-muted" style="font-weight:400;font-size:0.9rem;" id="favCount">(0)</span>
    </h1>
  </div>

  <!-- TOOLS: SEARCH & SORT -->
  <div class="favorite-tools" id="favoriteTools" style="display:none;">
    <div class="favorite-search" id="favoriteSearchBox">
      <button type="button" id="favoriteSearchToggle" aria-label="Cari favorit" title="Cari favorit">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </button>
      <input id="favoriteSearchInput" type="search" placeholder="Cari favorit..." aria-label="Cari judul favorit" autocomplete="off">
    </div>
    <select id="favoriteSort" aria-label="Urutkan favorit">
      <option value="updated">Update terbaru</option>
      <option value="added">Waktu ditambahkan</option>
    </select>
  </div>

  <!-- LOCAL NOTICE -->
  <div id="favoriteLocalNotice" style="display:none;margin:10px 0 14px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg-card);color:var(--text);font-size:.9rem">
    Favorit saat ini tersimpan di browser ini. <a href="/p/login.html"><strong>Masuk kembali</strong></a> untuk menggabungkan perubahan dengan akunmu.
  </div>

  <!-- GRID KOMIK -->
  <div class="comic-grid mt-2" id="favGrid" style="visibility: visible;"></div>

  <!-- KONDISI KOSONG -->
  <div class="favorites-empty" id="favEmpty" style="display:none; text-align:center; padding: 60px 20px;">
    <svg fill="currentColor" height="64" viewBox="0 0 24 24" width="64" style="color:var(--border); margin:0 auto 16px;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <h2 class="mt-2" style="color:var(--text-secondary);">Belum ada komik favorit</h2>
    <p style="color:var(--text-muted);">Anda belum menyimpan komik apapun. Silakan klik tombol "Simpan Favorit" pada halaman detail komik.</p>
  </div>
